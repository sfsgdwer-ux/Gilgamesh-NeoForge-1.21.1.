name: Build Gilgamesh NeoForge (Tensura Ultimate Skill)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Validate KubeJS registration script
        run: node --check integration/kubejs/startup_scripts/gilgamesh_tensura_skill.js
      - name: Compile NeoForge mod
        run: gradle --no-daemon clean build --stacktrace
      - name: Assemble Minecraft installation tree
        run: |
          mkdir -p build/release/mods build/release/kubejs/startup_scripts
          cp build/libs/*.jar build/release/mods/
          cp integration/kubejs/startup_scripts/gilgamesh_tensura_skill.js build/release/kubejs/startup_scripts/
          cp INSTALL_TH.md build/release/
      - name: Upload installable bundle
        uses: actions/upload-artifact@v4
        with:
          name: Gilgamesh-v1.3.0-Tensura-Ultimate-Skill
          path: build/release/
          if-no-files-found: error
