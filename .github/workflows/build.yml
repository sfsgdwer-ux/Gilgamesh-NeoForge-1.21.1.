name: Build Gilgamesh Native Ultimate Skill
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build against Tensura and ManasCore
        run: gradle --no-daemon clean build --stacktrace
      - name: Inspect Tensura energy APIs
        if: success()
        run: |
          TENSURA="$(find "$HOME/.gradle/caches/modules-2/files-2.1/curse.maven/tensura-reincarnated-643695" -name '*.jar' -print -quit)"
          echo "=== EnergyHelper public API ==="
          javap -classpath "$TENSURA" -public io.github.manasmods.tensura.util.EnergyHelper | head -125 || true
          echo '=== GainType enum ==='
          javap -classpath "$TENSURA" -public 'io.github.manasmods.tensura.util.EnergyHelper$GainType' | head -60 || true
          echo '=== DrainType enum ==='
          javap -classpath "$TENSURA" -public 'io.github.manasmods.tensura.util.EnergyHelper$DrainType' | head -60 || true
          echo "=== Energy classes ==="
          jar tf "$TENSURA" | grep -Ei '(Magicule|Aura|Energy).*[.]class$' | head -100 || true
      - name: Assemble installation tree
        run: |
          mkdir -p build/release/mods
          cp build/libs/*.jar build/release/mods/
          cp INSTALL_TH.md build/release/
      - uses: actions/upload-artifact@v4
        with:
          name: Gilgamesh-v1.7.0-Enuma-3D-VFX-Experimental
          path: build/release/
          if-no-files-found: error
