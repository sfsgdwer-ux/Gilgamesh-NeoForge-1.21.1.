name: Build Gilgamesh Native Ultimate Skill
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build against Tensura and ManasCore (no scripting addons)
        run: gradle --no-daemon clean build --stacktrace
      - name: Assemble single JAR installation
        run: |
          mkdir -p build/release/mods
          cp build/libs/*.jar build/release/mods/
          cp INSTALL_TH.md build/release/
      - uses: actions/upload-artifact@v4
        with:
          name: Gilgamesh-v1.4.0-Native-Ultimate-Skill
          path: build/release/
          if-no-files-found: error
