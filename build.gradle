plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        gilgamesh_tensura {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // Compiled against official release files; never redistribute these dependencies.
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://maven.architectury.dev' }
}

// ManasCore 4.0.0.2 ships its SkillAPI in a nested NeoForge Jar-in-Jar.
// Extract the nested modules for javac (only); do not ship them in our JAR.
configurations {
    manasCorePacked
}
def extractedManas = file("$buildDir/compileOnlyManas")

dependencies {
    manasCorePacked 'curse.maven:manascore-619025:8022425'
    compileOnly 'curse.maven:manascore-619025:8022425'
    compileOnly 'curse.maven:tensura-reincarnated-643695:9289888'
    compileOnly 'dev.architectury:architectury-neoforge:13.0.8'
    compileOnly fileTree(dir: extractedManas, include: '*.jar')
}

tasks.register('extractManasCoreModules') {
    inputs.files(configurations.manasCorePacked)
    outputs.dir(extractedManas)
    doLast {
        extractedManas.mkdirs()
        copy {
            from zipTree(configurations.manasCorePacked.singleFile)
            include 'META-INF/jars/*.jar'
            into extractedManas
            eachFile { d -> d.path = d.name }
            includeEmptyDirs = false
        }
        if (fileTree(dir: extractedManas, include: 'manascore-skill-*.jar').isEmpty()) {
            throw new GradleException('ManasCore SkillAPI nested jar was not found')
        }
    }
}
tasks.named('compileJava') {
    dependsOn tasks.named('extractManasCoreModules')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// Original translucent Enuma Elish VFX sprites, generated at build time so
// public GitHub builds and local JARs contain identical artwork without
// relying on a third-party texture pack or an external Python installation.
def enumaGeneratedRoot = file("$buildDir/generated/enuma_vfx_resources")
sourceSets.main.resources.srcDir(enumaGeneratedRoot)

tasks.register('generateEnumaCinematicTextures') {
    outputs.dir(enumaGeneratedRoot)
    doLast {
        def textureDir = new File(enumaGeneratedRoot,
            'assets/gilgamesh_tensura/textures/item')
        textureDir.mkdirs()
        def variants = [
            enuma_cinematic_core:      [252, 48,  85, 114, 3.7d],
            enuma_cinematic_highlight: [255, 189, 102, 165, 5.5d],
            enuma_cinematic_aura:      [177, 24,  82,  92, 2.6d],
            enuma_cinematic_ring:      [238, 136, 54, 162, 2.2d]
        ]
        variants.each { String name, List settings ->
            int width = 64, height = 64
            def img = new java.awt.image.BufferedImage(width,height,
                java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<height;y++) for(int x=0;x<width;x++) {
                double nx=(x+0.5-width/2.0)/(width/2.0)
                double ny=(y+0.5-height/2.0)/(height/2.0)
                double d=nx*nx+ny*ny
                double fade=Math.exp(-d*(settings[4] as double))
                double ripple=0.86+0.14*Math.sin(nx*8.2+ny*5.4)
                int alpha=(int)Math.round(
                    Math.min(230,Math.max(0,(settings[3] as int)*fade*ripple)))
                int red=Math.min(255,Math.max(0,settings[0] as int))
                int green=Math.min(255,Math.max(0,settings[1] as int))
                int blue=Math.min(255,Math.max(0,settings[2] as int))
                img.setRGB(x,y, (alpha<<24)|(red<<16)|(green<<8)|blue)
            }
            javax.imageio.ImageIO.write(img,'png',
                new File(textureDir,name+'.png'))
        }
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateEnumaCinematicTextures')
}
